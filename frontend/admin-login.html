<!DOCTYPE html>
<html lang="en">
<head>
    <script src="js/config.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CampusCare Admin Login</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #eef4ff, #f8faff);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #14213d;
        }

        .login-card {
            width: 440px;
            max-width: 92%;
            background: white;
            padding: 45px;
            border-radius: 22px;
            box-shadow: 0 25px 60px rgba(20, 33, 61, 0.12);
        }

        .logo {
            text-align: center;
            margin-bottom: 35px;
        }

        .logo h1 {
            color: #2864e8;
            font-size: 38px;
            margin-bottom: 8px;
        }

        .logo p {
            color: #667085;
        }

        .admin-badge {
            display: inline-block;
            margin-top: 15px;
            padding: 7px 14px;
            border-radius: 20px;
            background: #eef4ff;
            color: #2864e8;
            font-size: 12px;
            font-weight: bold;
            letter-spacing: 1px;
        }

        .form-group {
            margin-bottom: 22px;
        }

        label {
            display: block;
            font-size: 15px;
            font-weight: bold;
            margin-bottom: 9px;
        }

        input {
            width: 100%;
            padding: 15px;
            border: 1px solid #cbd5e1;
            border-radius: 11px;
            font-size: 16px;
            outline: none;
        }

        input:focus {
            border-color: #2864e8;
            box-shadow: 0 0 0 3px rgba(40, 100, 232, 0.1);
        }

        button {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 11px;
            background: linear-gradient(135deg, #2864e8, #4b45e8);
            color: white;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            transform: translateY(-1px);
        }

        #message {
            margin-top: 18px;
            padding: 13px;
            border-radius: 10px;
            text-align: center;
            display: none;
        }

        .error {
            display: block !important;
            background: #fee2e2;
            color: #b91c1c;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 25px;
            color: #2864e8;
            text-decoration: none;
        }
    </style>
</head>

<body>

<div class="login-card">

    <div class="logo">
        <h1>CampusCare</h1>
        <p>Campus Complaint Management System</p>
        <span class="admin-badge">ADMIN PORTAL</span>
    </div>

    <form id="adminLoginForm">

        <div class="form-group">
            <label for="email">Admin Email</label>
            <input
                type="email"
                id="email"
                placeholder="Enter admin email"
                required
            >
        </div>

        <div class="form-group">
            <label for="password">Password</label>
            <input
                type="password"
                id="password"
                placeholder="Enter admin password"
                required
            >
        </div>

        <button type="submit">
            Admin Login
        </button>

        <div id="message"></div>

    </form>

    <a href="index.html" class="back">
        ← Back to Home
    </a>

</div>

<script>

const API_BASE = window.CAMPUSCARE_API_BASE_URL;

document
    .getElementById("adminLoginForm")
    .addEventListener("submit", async function(event) {

        event.preventDefault();

        const email = document.getElementById("email").value.trim();
        const password = document.getElementById("password").value;

        const message = document.getElementById("message");

        message.className = "";
        message.style.display = "none";

        try {

            const response = await fetch(
                `${API_BASE}/api/auth/login`,
                {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        email: email,
                        password: password
                    })
                }
            );

            const data = await response.json();

            if (!response.ok) {
                throw new Error(
                    data.detail || "Invalid admin email or password"
                );
            }

            if (!data.user || data.user.role !== "admin") {

                message.textContent =
                    "This account is not an administrator.";

                message.className = "error";

                return;
            }

            localStorage.setItem(
                "access_token",
                data.access_token
            );

            localStorage.setItem(
                "user",
                JSON.stringify(data.user)
            );

            window.location.href = "admin-dashboard.html";

        } catch (error) {

            message.textContent =
                error.message || "Unable to connect to CampusCare backend.";

            message.className = "error";
        }

    });

</script>

</body>
</html>
