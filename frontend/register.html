
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account | CampusCare</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            padding: 30px 16px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #f3f8ff, #e8edff);
            color: #14213d;
        }

        .register-card {
            width: 100%;
            max-width: 510px;
            padding: 36px;
            background: white;
            border: 1px solid #dce5f4;
            border-radius: 22px;
            box-shadow: 0 18px 50px rgba(35, 75, 140, 0.10);
        }

        .logo {
            width: 58px;
            height: 58px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 24px;
            border-radius: 16px;
            background: #dceaff;
            color: #2563eb;
            font-size: 36px;
            font-weight: bold;
        }

        h1 {
            margin-bottom: 12px;
            font-size: 29px;
        }

        .subtitle {
            margin-bottom: 25px;
            color: #64748b;
            line-height: 1.6;
            font-size: 14px;
        }

        .field {
            margin-bottom: 19px;
        }

        label {
            display: block;
            margin-bottom: 9px;
            font-size: 13px;
            font-weight: bold;
        }

        input, select {
            width: 100%;
            min-height: 46px;
            padding: 12px 14px;
            border: 1px solid #d4dfef;
            border-radius: 10px;
            background: white;
            color: #14213d;
            font-size: 14px;
            outline: none;
        }

        input:focus, select:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
        }

        .password-row {
            display: flex;
            gap: 8px;
        }

        .password-row input {
            flex: 1;
            min-width: 0;
        }

        .toggle-password {
            padding: 0 13px;
            border: 1px solid #d4dfef;
            border-radius: 10px;
            background: #f8fafc;
            cursor: pointer;
        }

        .hint {
            margin-top: 8px;
            color: #64748b;
            font-size: 12px;
            line-height: 1.5;
        }

        .message {
            display: none;
            margin-bottom: 20px;
            padding: 12px;
            border-radius: 10px;
            font-size: 13px;
            line-height: 1.5;
            overflow-wrap: anywhere;
        }

        .message.error {
            display: block;
            color: #b91c1c;
            background: #fff1f2;
            border: 1px solid #fecaca;
        }

        .message.success {
            display: block;
            color: #166534;
            background: #f0fdf4;
            border: 1px solid #bbf7d0;
        }

        .submit-btn {
            width: 100%;
            min-height: 47px;
            margin-top: 2px;
            border: none;
            border-radius: 10px;
            background: #2563eb;
            color: white;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
        }

        .submit-btn:hover {
            background: #1d4ed8;
        }

        .submit-btn:disabled {
            opacity: 0.65;
            cursor: not-allowed;
        }

        .footer {
            margin-top: 25px;
            text-align: center;
            color: #64748b;
            font-size: 13px;
        }

        a {
            color: #2563eb;
            font-weight: bold;
            text-decoration: none;
        }

        [hidden] {
            display: none !important;
        }

        @media (max-width: 480px) {
            .register-card {
                padding: 25px 20px;
            }

            h1 {
                font-size: 25px;
            }
        }
    </style>
</head>

<body>
    <main class="register-card">
        <div class="logo">+</div>

        <h1>Create your account</h1>

        <p class="subtitle">
            Join CampusCare to submit and manage campus maintenance complaints.
        </p>

        <div id="message" class="message"
             role="alert" aria-live="polite"></div>

        <form id="registerForm">
            <div class="field">
                <label for="name">Full name</label>
                <input
                    type="text"
                    id="name"
                    name="name"
                    placeholder="Enter your full name"
                    maxlength="120"
                    autocomplete="name"
                    required
                >
            </div>

            <div class="field">
                <label for="email">Email address</label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="you@example.com"
                    maxlength="254"
                    autocomplete="email"
                    required
                >
            </div>

            <div class="field">
                <label for="role">Register as</label>
                <select id="role" name="role" required>
                    <option value="student">Student</option>
                    <option value="staff">Staff</option>
                    <option value="admin">Admin</option>
                </select>

                <p id="roleHint" class="hint">
                    Student accounts can register here.
                </p>
            </div>

            <div class="field" id="registrationCodeField" hidden>
                <label for="registrationCode">
                    Authorization code
                </label>

                <input
                    type="password"
                    id="registrationCode"
                    name="registration_code"
                    autocomplete="off"
                    placeholder="Enter your authorization code"
                >

                <p class="hint">
                    Required for authorized Staff and Admin registration.
                </p>
            </div>

            <div class="field">
                <label for="password">Password</label>

                <div class="password-row">
                    <input
                        type="password"
                        id="password"
                        name="password"
                        minlength="8"
                        maxlength="256"
                        autocomplete="new-password"
                        placeholder="At least 8 characters"
                        required
                    >

                    <button
                        class="toggle-password"
                        type="button"
                        data-target="password"
                    >Show</button>
                </div>
            </div>

            <div class="field">
                <label for="confirmPassword">Confirm password</label>

                <div class="password-row">
                    <input
                        type="password"
                        id="confirmPassword"
                        name="confirmPassword"
                        minlength="8"
                        maxlength="256"
                        autocomplete="new-password"
                        placeholder="Re-enter your password"
                        required
                    >

                    <button
                        class="toggle-password"
                        type="button"
                        data-target="confirmPassword"
                    >Show</button>
                </div>
            </div>

            <button id="submitBtn" class="submit-btn" type="submit">
                Create Account
            </button>
        </form>

        <p class="footer">
            Already have an account?
            <a href="login.html">Sign in</a>
        </p>
    </main>

    <script>
        const REGISTER_API =
            "http://127.0.0.1:8000/api/auth/register";

        const form = document.getElementById("registerForm");
        const message = document.getElementById("message");
        const role = document.getElementById("role");
        const roleHint = document.getElementById("roleHint");
        const submitBtn = document.getElementById("submitBtn");

        const registrationCodeField =
            document.getElementById("registrationCodeField");

        const registrationCode =
            document.getElementById("registrationCode");

        function showMessage(text, type) {
            message.textContent = text;
            message.className = "message " + type;
        }

        function clearMessage() {
            message.textContent = "";
            message.className = "message";
        }

        function updateRoleUI() {
            clearMessage();

            const selectedRole = role.value;
            const needsCode = selectedRole === "staff" ||
                              selectedRole === "admin";

            registrationCodeField.hidden = !needsCode;
            registrationCode.required = needsCode;

            if (!needsCode) {
                registrationCode.value = "";
            }

            if (selectedRole === "student") {
                roleHint.textContent =
                    "Student accounts can register here.";
            } else if (selectedRole === "staff") {
                roleHint.textContent =
                    "Enter your authorized Staff registration code.";
            } else {
                roleHint.textContent =
                    "Enter your authorized Admin registration code.";
            }
        }

        role.addEventListener("change", updateRoleUI);
        updateRoleUI();

        document.querySelectorAll(".toggle-password").forEach(button => {
            button.addEventListener("click", () => {
                const input =
                    document.getElementById(button.dataset.target);

                const showing = input.type === "text";

                input.type = showing ? "password" : "text";
                button.textContent = showing ? "Show" : "Hide";
            });
        });

        form.addEventListener("submit", async event => {
            event.preventDefault();
            clearMessage();

            const name =
                document.getElementById("name").value.trim();

            const email =
                document.getElementById("email").value.trim();

            const password =
                document.getElementById("password").value;

            const confirmPassword =
                document.getElementById("confirmPassword").value;

            if (!name) {
                showMessage("Please enter your full name.", "error");
                return;
            }

            if (password.length < 8) {
                showMessage(
                    "Password must contain at least 8 characters.",
                    "error"
                );
                return;
            }

            if (password !== confirmPassword) {
                showMessage("Passwords do not match.", "error");
                return;
            }

            const selectedRole = role.value;

            if (
                selectedRole !== "student" &&
                !registrationCode.value.trim()
            ) {
                showMessage(
                    "Enter the authorization code for this role.",
                    "error"
                );
                return;
            }

            submitBtn.disabled = true;
            submitBtn.textContent = "Creating account...";

            try {
                const payload = {
                    name: name,
                    email: email,
                    password: password,
                    role: selectedRole,
                    registration_code:
                        selectedRole === "student"
                            ? null
                            : registrationCode.value
                };

                const response = await fetch(REGISTER_API, {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify(payload)
                });

                const data = await response.json().catch(() => ({}));

                if (!response.ok) {
                    const detail = data.detail;

                    const errorText = Array.isArray(detail)
                        ? detail.map(item => item.msg || "Invalid input")
                              .join(", ")
                        : typeof detail === "string"
                            ? detail
                            : "Registration failed. Please try again.";

                    showMessage(errorText, "error");
                    return;
                }

                showMessage(
                    "Account created successfully! Redirecting to login...",
                    "success"
                );

                form.reset();
                updateRoleUI();

                setTimeout(() => {
                    window.location.href = "login.html";
                }, 1200);

            } catch (error) {
                showMessage(
                    "Cannot connect to the backend. Make sure FastAPI is running on port 8000.",
                    "error"
                );
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = "Create Account";
            }
        });
    </script>
</body>
</html>
