<!DOCTYPE html>
<html lang="en">

<head>
    <script src="js/config.js"></script>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CampusCare | Track Complaints</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Segoe UI", Arial, sans-serif;
        }

        body {
            background: #f4f7fb;
            color: #172033;
        }


        /* =========================================
           MAIN LAYOUT
        ========================================= */

        .dashboard {
            display: flex;
            min-height: 100vh;
        }


        /* =========================================
           SIDEBAR
        ========================================= */

        .sidebar {

            width: 250px;

            background:
                linear-gradient(
                    180deg,
                    #0f172a,
                    #172554
                );

            color: white;

            padding: 25px 18px;

            display: flex;
            flex-direction: column;

            position: fixed;

            left: 0;
            top: 0;
            bottom: 0;

            z-index: 100;
        }


        .logo {
            padding: 5px 12px 35px;
        }


        .logo h1 {

            font-size: 27px;

            letter-spacing: -0.5px;
        }


        .logo span {
            color: #60a5fa;
        }


        .logo p {

            color: #94a3b8;

            font-size: 12px;

            margin-top: 5px;
        }


        /* =========================================
           NAVIGATION
        ========================================= */

        .nav {

            display: flex;

            flex-direction: column;

            gap: 8px;
        }


        .nav a {

            text-decoration: none;

            color: #cbd5e1;

            padding: 13px 15px;

            border-radius: 10px;

            display: flex;

            align-items: center;

            gap: 12px;

            font-size: 15px;

            transition: 0.25s;
        }


        .nav a:hover {

            background:
                rgba(255,255,255,0.08);

            color: white;

            transform:
                translateX(3px);
        }


        .nav a.active {

            background: #2563eb;

            color: white;

            box-shadow:
                0 7px 18px
                rgba(37,99,235,0.30);
        }


        .nav-icon {

            width: 22px;

            text-align: center;

            font-size: 17px;
        }


        /* =========================================
           SIDEBAR BOTTOM
        ========================================= */

        .sidebar-bottom {

            margin-top: auto;
        }


        .user-mini {

            border-top:
                1px solid
                rgba(255,255,255,0.1);

            padding: 18px 10px;

            margin-bottom: 10px;
        }


        .user-mini strong {

            display: block;

            color: white;

            font-size: 14px;
        }


        .user-mini small {

            color: #94a3b8;

            font-size: 12px;
        }


        .logout-btn {

            width: 100%;

            border: none;

            background: #ef4444;

            color: white;

            padding: 12px;

            border-radius: 9px;

            cursor: pointer;

            font-size: 14px;

            font-weight: 600;

            transition: 0.2s;
        }


        .logout-btn:hover {

            background: #dc2626;
        }


        /* =========================================
           MAIN CONTENT
        ========================================= */

        .main {

            margin-left: 250px;

            width:
                calc(100% - 250px);

            padding: 35px 45px;
        }


        /* =========================================
           HEADER
        ========================================= */

        .page-header {

            display: flex;

            justify-content:
                space-between;

            align-items: center;

            margin-bottom: 30px;
        }


        .page-title h2 {

            font-size: 30px;

            margin-bottom: 7px;
        }


        .page-title p {

            color: #64748b;

            font-size: 15px;
        }


        /* =========================================
           PROFILE
        ========================================= */

        .profile {

            display: flex;

            align-items: center;

            gap: 12px;

            background: white;

            padding:
                8px 15px 8px 8px;

            border-radius: 40px;

            box-shadow:
                0 4px 15px
                rgba(15,23,42,0.07);
        }


        .avatar {

            width: 42px;

            height: 42px;

            border-radius: 50%;

            background:
                linear-gradient(
                    135deg,
                    #2563eb,
                    #60a5fa
                );

            color: white;

            display: flex;

            align-items: center;

            justify-content: center;

            font-weight: bold;

            font-size: 16px;
        }


        .profile-info strong {

            display: block;

            font-size: 13px;
        }


        .profile-info small {

            color: #64748b;

            font-size: 11px;
        }


        /* =========================================
           TOP ACTION
        ========================================= */

        .top-actions {

            display: flex;

            justify-content:
                space-between;

            align-items: center;

            margin-bottom: 25px;
        }


        .summary {

            display: flex;

            gap: 12px;
        }


        .summary-card {

            background: white;

            border: 1px solid #eef2f7;

            border-radius: 12px;

            padding:
                14px 20px;

            min-width: 125px;

            box-shadow:
                0 4px 15px
                rgba(15,23,42,0.05);
        }


        .summary-card span {

            display: block;

            color: #64748b;

            font-size: 12px;

            margin-bottom: 4px;
        }


        .summary-card strong {

            font-size: 22px;
        }


        .new-btn {

            text-decoration: none;

            background: #2563eb;

            color: white;

            padding:
                13px 20px;

            border-radius: 9px;

            font-size: 14px;

            font-weight: 600;

            transition: 0.2s;
        }


        .new-btn:hover {

            background: #1d4ed8;

            transform:
                translateY(-1px);

            box-shadow:
                0 7px 15px
                rgba(37,99,235,0.20);
        }


        /* =========================================
           COMPLAINT LIST
        ========================================= */

        .complaints-container {

            display: flex;

            flex-direction: column;

            gap: 20px;
        }


        .complaint-card {

            background: white;

            border-radius: 17px;

            padding: 26px;

            border:
                1px solid #e9eef5;

            box-shadow:
                0 6px 22px
                rgba(15,23,42,0.06);

            transition: 0.25s;
        }


        .complaint-card:hover {

            transform:
                translateY(-2px);

            box-shadow:
                0 10px 28px
                rgba(15,23,42,0.09);
        }


        /* =========================================
           COMPLAINT HEADER
        ========================================= */

        .complaint-header {

            display: flex;

            justify-content:
                space-between;

            align-items: flex-start;

            margin-bottom: 22px;
        }


        .complaint-title {

            display: flex;

            gap: 14px;

            align-items: flex-start;
        }


        .complaint-icon {

            width: 46px;

            height: 46px;

            border-radius: 12px;

            background: #eff6ff;

            color: #2563eb;

            display: flex;

            align-items: center;

            justify-content: center;

            font-size: 21px;
        }


        .complaint-title h3 {

            font-size: 19px;

            margin-bottom: 5px;
        }


        .complaint-id {

            color: #64748b;

            font-size: 13px;
        }


        /* =========================================
           STATUS
        ========================================= */

        .status {

            padding:
                7px 14px;

            border-radius: 20px;

            font-size: 12px;

            font-weight: 600;
        }


        .status-pending {

            background: #fef3c7;

            color: #92400e;
        }


        .status-progress {

            background: #dbeafe;

            color: #1d4ed8;
        }


        .status-resolved {

            background: #dcfce7;

            color: #166534;
        }


        /* =========================================
           DETAILS
        ========================================= */

        .details {

            display: grid;

            grid-template-columns:
                repeat(3, 1fr);

            gap: 14px;

            margin-bottom: 22px;
        }


        .detail-box {

            background: #f8fafc;

            border:
                1px solid #eef2f7;

            border-radius: 11px;

            padding: 16px;
        }


        .detail-label {

            display: block;

            color: #64748b;

            font-size: 12px;

            margin-bottom: 7px;
        }


        .detail-value {

            font-size: 14px;

            font-weight: 600;

            color: #172033;
        }


        /* =========================================
           DESCRIPTION
        ========================================= */

        .description {

            border-top:
                1px solid #eef2f7;

            padding-top: 20px;
        }


        .description h4 {

            font-size: 14px;

            margin-bottom: 8px;
        }


        .description p {

            color: #64748b;

            font-size: 14px;

            line-height: 1.6;
        }


        /* =========================================
           DATE
        ========================================= */

        .complaint-footer {

            display: flex;

            justify-content:
                space-between;

            align-items: center;

            margin-top: 20px;

            padding-top: 16px;

            border-top:
                1px solid #eef2f7;
        }


        .date {

            color: #94a3b8;

            font-size: 12px;
        }


        .tracking-message {

            color: #2563eb;

            font-size: 12px;

            font-weight: 600;
        }


        /* =========================================
           EMPTY STATE
        ========================================= */

        .empty {

            background: white;

            border-radius: 17px;

            padding: 70px 30px;

            text-align: center;

            border:
                1px solid #e9eef5;

            box-shadow:
                0 6px 22px
                rgba(15,23,42,0.05);
        }


        .empty-icon {

            width: 75px;

            height: 75px;

            margin:
                0 auto 20px;

            border-radius: 50%;

            background: #eff6ff;

            display: flex;

            align-items: center;

            justify-content: center;

            font-size: 32px;
        }


        .empty h3 {

            font-size: 20px;

            margin-bottom: 8px;
        }


        .empty p {

            color: #64748b;

            font-size: 14px;

            margin-bottom: 22px;
        }


        /* =========================================
           LOADING
        ========================================= */

        .loading {

            background: white;

            border-radius: 17px;

            padding: 60px;

            text-align: center;

            color: #64748b;

            box-shadow:
                0 6px 22px
                rgba(15,23,42,0.05);
        }


        /* =========================================
           ERROR
        ========================================= */

        .error {

            background: #fee2e2;

            color: #b91c1c;

            border:
                1px solid #fecaca;

            border-radius: 12px;

            padding: 18px;

            text-align: center;
        }


        /* =========================================
           MOBILE
        ========================================= */

        @media (max-width: 900px) {

            .sidebar {

                width: 210px;
            }


            .main {

                margin-left: 210px;

                width:
                    calc(100% - 210px);

                padding: 25px;
            }


            .details {

                grid-template-columns:
                    1fr 1fr;
            }


            .summary-card {

                min-width: 100px;
            }

        }


        @media (max-width: 650px) {

            .dashboard {

                display: block;
            }


            .sidebar {

                position: relative;

                width: 100%;

                height: auto;
            }


            .main {

                margin-left: 0;

                width: 100%;

                padding: 20px;
            }


            .nav {

                flex-direction: row;

                overflow-x: auto;
            }


            .nav a {

                white-space: nowrap;
            }


            .page-header {

                display: block;
            }


            .profile {

                display: none;
            }


            .top-actions {

                display: block;
            }


            .summary {

                overflow-x: auto;

                margin-bottom: 15px;
            }


            .details {

                grid-template-columns: 1fr;
            }


            .complaint-header {

                display: block;
            }


            .status {

                display: inline-block;

                margin-top: 12px;
            }

        }

    </style>

</head>


<body>


<div class="dashboard">


    <!-- =========================================
         SIDEBAR
    ========================================== -->

    <aside class="sidebar">

        <div class="logo">

            <h1>
                Campus<span>Care</span>
            </h1>

            <p>
                Student Portal
            </p>

        </div>


        <nav class="nav">

            <a href="student-dashboard.html">

                <span class="nav-icon">
                    ⌂
                </span>

                Dashboard

            </a>


            <a href="complaint-form.html">

                <span class="nav-icon">
                    ＋
                </span>

                Report Issue

            </a>


            <a
                href="track-complaint.html"
                class="active"
            >

                <span class="nav-icon">
                    ◉
                </span>

                Track Complaints

            </a>

        </nav>


        <div class="sidebar-bottom">

            <div class="user-mini">

                <strong id="sidebarName">
                    Student
                </strong>

                <small id="sidebarEmail">
                    student@email.com
                </small>

            </div>


            <button
                class="logout-btn"
                onclick="logout()"
            >
                Logout
            </button>

        </div>

    </aside>



    <!-- =========================================
         MAIN
    ========================================== -->

    <main class="main">


        <!-- HEADER -->

        <div class="page-header">

            <div class="page-title">

                <h2>
                    Track My Complaints
                </h2>

                <p>
                    View the status and details of your submitted complaints.
                </p>

            </div>


            <div class="profile">

                <div
                    class="avatar"
                    id="avatar"
                >
                    S
                </div>


                <div class="profile-info">

                    <strong id="profileName">
                        Student
                    </strong>

                    <small>
                        Student Account
                    </small>

                </div>

            </div>

        </div>



        <!-- TOP ACTIONS -->

        <div class="top-actions">

            <div class="summary">

                <div class="summary-card">

                    <span>
                        Total
                    </span>

                    <strong id="totalCount">
                        0
                    </strong>

                </div>


                <div class="summary-card">

                    <span>
                        Pending
                    </span>

                    <strong id="pendingCount">
                        0
                    </strong>

                </div>


                <div class="summary-card">

                    <span>
                        In Progress
                    </span>

                    <strong id="progressCount">
                        0
                    </strong>

                </div>


                <div class="summary-card">

                    <span>
                        Resolved
                    </span>

                    <strong id="resolvedCount">
                        0
                    </strong>

                </div>

            </div>


            <a
                href="complaint-form.html"
                class="new-btn"
            >
                ＋ Report New Issue
            </a>

        </div>



        <!-- COMPLAINTS -->

        <div
            id="complaintsContainer"
            class="complaints-container"
        >

            <div class="loading">
                Loading your complaints...
            </div>

        </div>


    </main>

</div>



<script>


    // =========================================
    // API
    // =========================================

    const API_BASE = window.CAMPUSCARE_API_BASE_URL;


    // =========================================
    // LOGIN CHECK
    // =========================================

    const token =
        localStorage.getItem(
            "access_token"
        );


    const userString =
        localStorage.getItem(
            "user"
        );


    if (!token || !userString) {

        window.location.href =
            "login.html";

    }


    let user;


    try {

        user =
            JSON.parse(userString);

    }

    catch (error) {

        localStorage.clear();

        window.location.href =
            "login.html";

    }



    // =========================================
    // USER INFORMATION
    // =========================================

    if (user) {

        document.getElementById(
            "profileName"
        ).textContent =
            user.name;


        document.getElementById(
            "sidebarName"
        ).textContent =
            user.name;


        document.getElementById(
            "sidebarEmail"
        ).textContent =
            user.email;


        document.getElementById(
            "avatar"
        ).textContent =
            user.name
                .charAt(0)
                .toUpperCase();

    }



    // =========================================
    // LOAD COMPLAINTS
    // =========================================

    async function loadComplaints() {

        const container =
            document.getElementById(
                "complaintsContainer"
            );


        try {

            const response =
                await fetch(
                    `${API_BASE}/api/complaints`,
                    {

                        method: "GET",

                        headers: {

                            "Authorization":
                                `Bearer ${token}`

                        }

                    }
                );


            if (response.status === 401) {

                localStorage.clear();

                window.location.href =
                    "login.html";

                return;

            }


            const data =
                await response.json();


            if (!response.ok) {

                throw new Error(
                    data.detail ||
                    "Unable to load complaints."
                );

            }


            const complaints =
                data.complaints || [];


            // =====================================
            // COUNTS
            // =====================================

            const pending =
                complaints.filter(
                    complaint =>
                        complaint.status === "Pending"
                ).length;


            const progress =
                complaints.filter(
                    complaint =>
                        complaint.status === "In Progress"
                ).length;


            const resolved =
                complaints.filter(
                    complaint =>
                        complaint.status === "Resolved"
                ).length;


            document.getElementById(
                "totalCount"
            ).textContent =
                complaints.length;


            document.getElementById(
                "pendingCount"
            ).textContent =
                pending;


            document.getElementById(
                "progressCount"
            ).textContent =
                progress;


            document.getElementById(
                "resolvedCount"
            ).textContent =
                resolved;



            // =====================================
            // NO COMPLAINTS
            // =====================================

            if (complaints.length === 0) {

                container.innerHTML = `

                    <div class="empty">

                        <div class="empty-icon">
                            📋
                        </div>

                        <h3>
                            No complaints yet
                        </h3>

                        <p>
                            You haven't submitted any campus complaints.
                        </p>

                        <a
                            href="complaint-form.html"
                            class="new-btn"
                        >
                            ＋ Report Your First Issue
                        </a>

                    </div>

                `;

                return;

            }



            // =====================================
            // CREATE CARDS
            // =====================================

            let html = "";


            complaints.forEach(
                complaint => {

                    let statusClass =
                        "status-pending";


                    if (
                        complaint.status ===
                        "In Progress"
                    ) {

                        statusClass =
                            "status-progress";

                    }


                    if (
                        complaint.status ===
                        "Resolved"
                    ) {

                        statusClass =
                            "status-resolved";

                    }


                    html += `

                        <div class="complaint-card">


                            <div class="complaint-header">


                                <div class="complaint-title">


                                    <div class="complaint-icon">
                                        📋
                                    </div>


                                    <div>

                                        <h3>
                                            ${escapeHTML(
                                                complaint.title
                                            )}
                                        </h3>

                                        <div class="complaint-id">
                                            Complaint ID:
                                            #CC-${complaint.complaint_id}
                                        </div>

                                    </div>

                                </div>


                                <span
                                    class="status ${statusClass}"
                                >
                                    ${escapeHTML(
                                        complaint.status
                                    )}
                                </span>


                            </div>



                            <div class="details">


                                <div class="detail-box">

                                    <span class="detail-label">
                                        Category
                                    </span>

                                    <span class="detail-value">
                                        ${escapeHTML(
                                            complaint.category
                                        )}
                                    </span>

                                </div>


                                <div class="detail-box">

                                    <span class="detail-label">
                                        Location
                                    </span>

                                    <span class="detail-value">
                                        ${escapeHTML(
                                            complaint.location
                                        )}
                                    </span>

                                </div>


                                <div class="detail-box">

                                    <span class="detail-label">
                                        Priority
                                    </span>

                                    <span class="detail-value">
                                        ${escapeHTML(
                                            complaint.priority
                                        )}
                                    </span>

                                </div>


                            </div>



                            <div class="description">

                                <h4>
                                    Description
                                </h4>

                                <p>
                                    ${escapeHTML(
                                        complaint.description
                                    )}
                                </p>

                            </div>



                            <div class="complaint-footer">

                                <span class="date">
                                    Submitted:
                                    ${formatDate(
                                        complaint.created_at
                                    )}
                                </span>


                                <span class="tracking-message">

                                    ${
                                        complaint.status === "Pending"
                                        ? "Waiting for staff review"
                                        : complaint.status === "In Progress"
                                        ? "Our team is working on it"
                                        : "Issue has been resolved"
                                    }

                                </span>

                            </div>


                        </div>

                    `;

                }
            );


            container.innerHTML =
                html;


        }

        catch (error) {

            console.error(
                "Complaint loading error:",
                error
            );


            container.innerHTML = `

                <div class="error">

                    Unable to load your complaints.
                    Please make sure the CampusCare backend is running.

                </div>

            `;

        }

    }



    // =========================================
    // DATE FORMAT
    // =========================================

    function formatDate(
        dateString
    ) {

        if (!dateString) {
            return "-";
        }


        const date =
            new Date(dateString);


        return date.toLocaleDateString(
            "en-IN",
            {

                day: "2-digit",

                month: "short",

                year: "numeric"

            }
        );

    }



    // =========================================
    // HTML SECURITY
    // =========================================

    function escapeHTML(value) {

        if (!value) {
            return "";
        }


        return String(value)

            .replace(
                /&/g,
                "&amp;"
            )

            .replace(
                /</g,
                "&lt;"
            )

            .replace(
                />/g,
                "&gt;"
            )

            .replace(
                /"/g,
                "&quot;"
            )

            .replace(
                /'/g,
                "&#039;"
            );

    }



    // =========================================
    // LOGOUT
    // =========================================

    function logout() {

        localStorage.removeItem(
            "access_token"
        );


        localStorage.removeItem(
            "user"
        );


        window.location.href =
            "login.html";

    }



    // =========================================
    // LOAD
    // =========================================

    loadComplaints();

</script>


</body>

</html>
